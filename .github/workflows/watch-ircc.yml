name: Watch IRCC pages

on:
  schedule:
    - cron: "23 13 * * 1" # Mondays, morning in Toronto
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare IRCC pages with the last snapshot
        id: check
        run: python3 .github/scripts/check_ircc.py

      - name: Save the new snapshot
        run: |
          if [ -n "$(git status --porcelain .github/ircc-snapshot.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ircc-snapshot.json
            git commit -m "Update IRCC page snapshot"
            git push
          fi

      - name: Open an issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "IRCC updated a page the calculator uses" --body-file ircc-changes.md
